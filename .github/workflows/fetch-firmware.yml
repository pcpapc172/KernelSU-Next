name: Fetch firmware images
on:
  push:
    branches:
      - claude/ksun-susfs-anykernel3-zip-2j28zf
    paths:
      - '.github/workflows/fetch-firmware.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ksun-susfs-anykernel3-zip-2j28zf

      - name: Download images
        run: |
          mkdir -p firmware-tmp
          curl -L --fail -o firmware-tmp/boot_new.img "https://filesto.o2zone.space/d/P0OfB9t"
          ls -la firmware-tmp/
          file firmware-tmp/*

      - name: Validate downloads
        run: |
          boot_size=$(stat -c%s firmware-tmp/boot_new.img)
          echo "boot_new.img: $boot_size bytes"

          if [ "$boot_size" -lt 30000000 ]; then
            echo "::error::boot_new.img is only $boot_size bytes, expected tens of MB. Likely got an HTML/error page instead of the real file."
            head -c 500 firmware-tmp/boot_new.img
            exit 1
          fi

          if ! file firmware-tmp/boot_new.img | grep -qi "android\|boot\|gzip\|LZ4\|data"; then
            echo "::warning::boot_new.img file type looks unexpected: $(file firmware-tmp/boot_new.img)"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware-tmp/boot_new.img
          git commit -m "Add updated boot.img for diagnosis (temporary)"
          git push origin HEAD:claude/ksun-susfs-anykernel3-zip-2j28zf
