name: Fetch firmware images
on:
  push:
    branches:
      - claude/ksun-susfs-anykernel3-zip-2j28zf
    paths:
      - '.github/workflows/fetch-firmware.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download images
        run: |
          curl -L -o boot.img "https://filesto.o2zone.space/d/TYfID44"
          curl -L -o vendor_boot.img "https://filesto.o2zone.space/d/LQRBvgz"
          ls -la boot.img vendor_boot.img
          file boot.img vendor_boot.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: |
            boot.img
            vendor_boot.img
          retention-days: 1
