name: Fetch firmware images
on:
  push:
    branches:
      - claude/ksun-susfs-anykernel3-zip-2j28zf
    paths:
      - '.github/workflows/fetch-firmware.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ksun-susfs-anykernel3-zip-2j28zf

      - name: Download images
        run: |
          mkdir -p firmware-tmp
          curl -L --fail -o firmware-tmp/manager.apk "https://filesto.o2zone.space/d/ea0kimg"
          curl -L --fail -o firmware-tmp/manager-spoofed.apk "https://filesto.o2zone.space/d/fwsW2gD"
          ls -la firmware-tmp/
          file firmware-tmp/*

      - name: Validate downloads
        run: |
          for f in manager.apk manager-spoofed.apk; do
            size=$(stat -c%s "firmware-tmp/$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes, expected several MB. Likely got an HTML/error page instead of the real file."
              head -c 500 "firmware-tmp/$f"
              exit 1
            fi
            if ! file "firmware-tmp/$f" | grep -qi "zip\|android"; then
              echo "::warning::$f file type looks unexpected: $(file "firmware-tmp/$f")"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware-tmp/manager.apk firmware-tmp/manager-spoofed.apk
          git commit -m "Add KernelSU-Next Manager APKs (manager + manager-spoofed)"
          git push origin HEAD:claude/ksun-susfs-anykernel3-zip-2j28zf
