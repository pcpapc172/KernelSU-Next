name: Fetch firmware images
on:
  push:
    branches:
      - claude/ksun-susfs-anykernel3-zip-2j28zf
    paths:
      - '.github/workflows/fetch-firmware.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ksun-susfs-anykernel3-zip-2j28zf

      - name: Download images
        run: |
          mkdir -p firmware-tmp
          curl -L --fail -o firmware-tmp/boot.img "https://filesto.o2zone.space/d/TYfID44"
          curl -L --fail -o firmware-tmp/vendor_boot.img "https://filesto.o2zone.space/d/LQRBvgz"
          ls -la firmware-tmp/
          file firmware-tmp/*

      - name: Validate downloads
        run: |
          boot_size=$(stat -c%s firmware-tmp/boot.img)
          vb_size=$(stat -c%s firmware-tmp/vendor_boot.img)
          echo "boot.img: $boot_size bytes"
          echo "vendor_boot.img: $vb_size bytes"

          if [ "$boot_size" -lt 50000000 ]; then
            echo "::error::boot.img is only $boot_size bytes, expected ~64MB. Likely got an HTML/error page instead of the real file."
            head -c 500 firmware-tmp/boot.img
            exit 1
          fi
          if [ "$vb_size" -lt 25000000 ]; then
            echo "::error::vendor_boot.img is only $vb_size bytes, expected ~32MB. Likely got an HTML/error page instead of the real file."
            head -c 500 firmware-tmp/vendor_boot.img
            exit 1
          fi

          if ! file firmware-tmp/boot.img | grep -qi "android\|boot\|gzip\|LZ4\|data"; then
            echo "::warning::boot.img file type looks unexpected: $(file firmware-tmp/boot.img)"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware-tmp/boot.img firmware-tmp/vendor_boot.img
          git commit -m "Add firmware images for diagnosis (temporary)"
          git push origin HEAD:claude/ksun-susfs-anykernel3-zip-2j28zf
